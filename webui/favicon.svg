<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e07"/>
      <stop offset="50%" style="stop-color:#2d1a0e"/>
      <stop offset="100%" style="stop-color:#0d0a08"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c850"/>
      <stop offset="40%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#a67c00"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffa940"/>
      <stop offset="100%" style="stop-color:#cc7000"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c"/>
      <stop offset="100%" style="stop-color:#8b1a1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- Inner decorative border -->
  <rect x="16" y="16" width="480" height="480" rx="52" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>

  <!-- Rudraksha Bead ( sacred bead ) at top -->
  <g transform="translate(256, 80)" filter="url(#glow)">
    <!-- Bead shape -->
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="url(#goldGrad)" opacity="0.9"/>
    <ellipse cx="0" cy="-8" rx="20" ry="10" fill="rgba(240,200,80,0.3)"/>
    <!-- Natural lines on rudraksha -->
    <path d="M-18,-20 Q0,-28 18,-20" stroke="#8b6914" stroke-width="1.2" fill="none"/>
    <path d="M-22,0 Q0,-8 22,0" stroke="#8b6914" stroke-width="1" fill="none"/>
    <path d="M-18,20 Q0,28 18,20" stroke="#8b6914" stroke-width="1.2" fill="none"/>
    <!-- Center hole -->
    <ellipse cx="0" cy="0" rx="5" ry="6" fill="#1a0e07"/>
  </g>

  <!-- Three horizontal lines ( Trishul symbolism ) -->
  <g transform="translate(256, 140)" filter="url(#glow)">
    <line x1="-60" y1="-12" x2="60" y2="-12" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-60" y1="12" x2="60" y2="12" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- RUDRAX letterforms -->
  <g transform="translate(256, 272)" filter="url(#glow)">
    <!-- Large R -->
    <text x="0" y="0" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="120" font-weight="800" fill="url(#goldGrad)" letter-spacing="-4">RUDRAX</text>
  </g>

  <!-- Slogan -->
  <g transform="translate(256, 340)">
    <text x="0" y="0" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="600" fill="url(#saffronGrad)" letter-spacing="6">BUILD · BREAK · DEPLOY</text>
  </g>

  <!-- Author credit -->
  <g transform="translate(256, 385)">
    <text x="0" y="0" text-anchor="middle" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#7a7269" letter-spacing="2">BY LALIT PANDIT</text>
  </g>

  <!-- Om symbol at bottom -->
  <g transform="translate(256, 440)" filter="url(#glow)" opacity="0.5">
    <text x="0" y="0" text-anchor="middle" font-size="36" fill="url(#goldGrad)">ॐ</text>
  </g>

  <!-- Corner decorative elements -->
  <g opacity="0.15">
    <path d="M50,50 L50,90 M50,50 L90,50" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M462,50 L462,90 M462,50 L422,50" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M50,462 L50,422 M50,462 L90,462" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M462,462 L462,422 M462,462 L422,462" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
</svg>